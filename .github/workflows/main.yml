name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine:
        description: "מנוע אודיו (folder = רק הקלטות מהתיקייה recordings)"
        type: choice
        options: [folder, edge, azure]
        default: folder

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: התקנת תלויות
        run: |
          npm install --no-audit --no-fund
          if [ "${{ inputs.engine }}" = "edge" ]; then pip install edge-tts; fi

      - name: הפקת אודיו והטמעה במשחק
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          python3 scripts/build_audio.py --html src/index.html \
            --engine "${{ inputs.engine || 'folder' }}" \
            --folder recordings --out www/index.html

      - name: יצירת פרויקט אנדרואיד
        run: |
          npx cap add android
          npx cap sync android

      - name: הגדרות אנדרואיד (כיוון אנכי)
        run: |
          sed -i 's|<activity|<activity android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml

      - name: בניית APK לבדיקה
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: בניית APK חתום (רק אם הוגדר מפתח)
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          (cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --out word-by-word-release.apk aligned.apk

      - name: העלאת התוצרים
        uses: actions/upload-artifact@v4
        with:
          name: word-by-word-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            word-by-word-release.apk
          if-no-files-found: warn
